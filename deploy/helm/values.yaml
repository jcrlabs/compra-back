replicaCount: 2

image:
  repository: ghcr.io/jcrlabs/compra-back
  pullPolicy: IfNotPresent
  tag: ""
  pullSecretName: ghcr-pull-secret

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
  host: ""
  tls: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

hpa:
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

config:
  env: production
  dbHost: postgres-service
  dbPort: "5432"
  dbName: compra
  dbSslMode: disable
  corsAllowedOrigins: "https://compra.jcrlabs.net"
  scraperCron: "0 3 * * *"
  mercadonaPostalCode: "28001"

secretName: compra-back-secrets

postgres:
  image: postgres:16-alpine
  storage: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
